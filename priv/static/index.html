<!--
  Project: Unfathomably BE
  File: priv/static/index.html

  Purpose:
    Provide a useful landing page before a production frontend is installed.

  Responsibilities:
    - identify the installed backend
    - direct operators to the matching frontend project

  This file intentionally does NOT contain instance-specific branding.
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Welcome to Unfathomably BE</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
    <style type="text/css">
      :root {
        --brand-color: #0482d8;
        --background-color: #f2f2f2;
      }

      body {
        background-color: var(--background-color);
        font-family: 'Lato', sans-serif;
        padding: 0;
        margin: 0;
      }

      main {
        max-width: 500px;
        margin: 0 auto;
        padding: 30px;
      }

      .logo {
        width: 160px;
        height: 160px;
        display: block;
        margin: 0 auto;
      }

      h2 {
        font-size: 1.5rem;
        font-weight: normal;
        line-height: 1.5;
      }

      p {
        line-height: 1.5;
      }

      a {
        color: var(--brand-color);
      }

      code {
        display: block;
        color: white;
        background-color: black;
        border-radius: 10px;
        padding: 10px;
      }

      code.inline {
        display: inline;
        border-radius: 4px;
        padding: 4px;
      }
    </style>
    <!--server-generated-meta-->
  </head>
  <body>
    <main>
      <img class="logo" src="/images/unfathomably-logo.svg" alt="Unfathomably">
      <h2>Almost done...</h2>
      <p>Congratulations! You've installed Unfathomably BE. Now you just need to install a frontend.</p>
      <h2>Installing Unfathomably FE</h2>
      <p>Download a production build from the <a href="https://github.com/fbxl-sj0/unfathomably-fe" target="_blank" rel="noopener noreferrer">Unfathomably FE project</a>.</p>
      <p>Then unpack it into the <code class="inline">instance</code> directory.</p>
      <p><strong>That's it!</strong> Just refresh this page.</p>
    </main>
  </body>
</html>

<!-- end of priv/static/index.html -->
