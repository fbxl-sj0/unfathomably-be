###############################################################################
# Unfathomably AT Protocol PDS Reverse Proxy
###############################################################################
#
# File: nginx-atproto-pds.conf
#
# Purpose:
#   Publish the private PDS endpoint and wildcard handle verification route.
#
# Responsibilities:
#   - proxy the PDS service at pds.fbxl.net
#   - proxy only AT Protocol handle verification on *.social.fbxl.net
#   - retain WebSocket support for repository subscriptions
#
# This file intentionally does NOT proxy a relay, AppView, or network firehose.

upstream unfathomably_atproto_pds {
    server 192.168.250.41:3000 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

server {
    listen 443 ssl;
    http2 on;
    server_name pds.fbxl.net;

    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/pds.fbxl.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pds.fbxl.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 32m;
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_request_buffering off;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Proxy "";

    location = /xrpc/com.atproto.server.createInviteCode {
        allow 192.168.250.0/24;
        deny all;
        proxy_pass http://unfathomably_atproto_pds;
    }

    location ^~ /xrpc/com.atproto.admin. {
        allow 192.168.250.0/24;
        deny all;
        proxy_pass http://unfathomably_atproto_pds;
    }

    location = /xrpc/com.atproto.sync.subscribeRepos {
        proxy_pass http://unfathomably_atproto_pds;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        proxy_pass http://unfathomably_atproto_pds;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name *.social.fbxl.net;

    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/atproto-handles.social.fbxl.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/atproto-handles.social.fbxl.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /.well-known/atproto-did {
        proxy_pass http://unfathomably_atproto_pds;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Proxy "";
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    server_name pds.fbxl.net *.social.fbxl.net;
    return 301 https://$host$request_uri;
}

# end of nginx-atproto-pds.conf
