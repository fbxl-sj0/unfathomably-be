###############################################################################
# Unfathomably AT Protocol PDS Bootstrap Proxy
###############################################################################
#
# File: nginx-atproto-pds-bootstrap.conf
#
# Purpose:
#   Make the private PDS reachable for certificate issuance after DNS changes.
#
# Responsibilities:
#   - expose the PDS endpoint over HTTP before its certificate exists
#   - expose only handle verification on wildcard account hosts
#   - provide a configuration that can be replaced by the TLS proxy atomically
#
# This file intentionally does NOT provide the final HTTPS service and must not
# remain installed after certificates have been issued.

upstream unfathomably_atproto_pds {
    server 192.168.250.41:3000 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

server {
    listen 80;
    server_name pds.fbxl.net;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 80;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header Proxy "";

    location / {
        proxy_pass http://unfathomably_atproto_pds;
    }
}

server {
    listen 80;
    server_name *.social.fbxl.net;

    location = /.well-known/atproto-did {
        proxy_pass http://unfathomably_atproto_pds;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 80;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header Proxy "";
    }

    location / {
        return 404;
    }
}

# end of nginx-atproto-pds-bootstrap.conf
